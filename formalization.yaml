  name: "Formalization of a weak Hellinger inequality"
  description: |-
    This is a Lean 4 formalization of the weak Hellinger inequality and the three-point inequality with its equality cases from the paper "A weak Hellinger inequality for noisy Boolean channels" by P. Durcik, M. Fraccaroli and J. Roos.

    For Boolean functions on a uniformly distributed cube passed through a binary symmetric channel, the Hellinger information obtainable through any one-bit statistic of the output is bounded by the value attained by dictator functions in positive dimensions. The proof uses an inequality in three real parameters, whose equality cases are characterized, together with explicit polynomial approximations and exact rational positivity certificates. The formalized inequality also includes the zero-dimensional cube.

    Reference: https://arxiv.org/abs/2609.28534v1.
